<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Major Groups — U.S. O*NET-SOC Occupations</title>
  <meta name="description" content="The 23 major groups of the U.S. O*NET-SOC occupational classification.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="side-menu" aria-label="Site navigation">
    <ul>
      <li><a href="index.html">Home</a></li>

  <main>

          <option value="50">50</option>
          <option value="100">100</option>

      <table>
        <thead>
          <tr>
            <th>Major group</th>

            <th class="num">Professions</th>
          </tr>

        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="pagination" id="pagination" aria-label="Pagination"></nav>

    <footer>
      <p>
        Source: <a href="https://www.onetonline.org/find/all" target="_blank" rel="noopener">O*NET OnLine</a>,
